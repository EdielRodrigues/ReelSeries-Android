
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar Android SDK do GitHub
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK" || exit 1

      - name: Instalar componentes Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar assinatura fixa do APK
        shell: bash
        env:
          REEL_DEBUG_KEYSTORE_B64: ${{ secrets.REEL_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$REEL_DEBUG_KEYSTORE_B64" ]; then
            echo 'ERRO: configure o secret REEL_DEBUG_KEYSTORE_B64 no GitHub.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$REEL_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Incrementar versionCode para permitir atualização
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,pathlib
          p=pathlib.Path('app/build.gradle.kts')
          if not p.exists(): raise SystemExit('Arquivo app/build.gradle.kts não encontrado')
          s=p.read_text()
          code=100000+int(os.environ['RUN_NUMBER'])
          s,n=re.subn(r'\bversionCode\s*=\s*\d+',f'versionCode = {code}',s,count=1)
          if n!=1: raise SystemExit('Não foi possível localizar versionCode no Gradle')
          p.write_text(s)
          print('versionCode atualizado:',code)
          PY

      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelSeries-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
