name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK"

      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar chave e verificar identidade ANTES da compilacao
        shell: bash
        env:
          REEL_DEBUG_KEYSTORE_B64: ${{ secrets.REEL_DEBUG_KEYSTORE_B64 }}
          REEL_SIGNING_SHA256: ${{ secrets.REEL_SIGNING_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$REEL_DEBUG_KEYSTORE_B64" ] || [ -z "$REEL_SIGNING_SHA256" ]; then
            echo 'ERRO: configure os dois secrets REEL_DEBUG_KEYSTORE_B64 e REEL_SIGNING_SHA256.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$REEL_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          ACTUAL="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print toupper($1)}')"
          EXPECTED="$(printf '%s' "$REEL_SIGNING_SHA256" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERRO: chave de assinatura diferente da esperada. SHA-256 obtido: $ACTUAL" >&2
            exit 1
          fi
          echo "Chave permanente confirmada: $ACTUAL"

      - name: Definir versionCode maior
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path('app/build.gradle.kts')
          if not p.exists(): raise SystemExit('app/build.gradle.kts nao encontrado')
          s = p.read_text()
          m = re.search(r'\bversionCode\s*=\s*(\d+)', s)
          if not m: raise SystemExit('versionCode nao encontrado')
          original = int(m.group(1))
          # A versao 19.1 do projeto parte de 300000. Nunca reduzir abaixo disso.
          code = max(300000, original) + int(os.environ['RUN_NUMBER'])
          s = s[:m.start(1)] + str(code) + s[m.end(1):]
          p.write_text(s)
          print('versionCode:', code)
          print('versionName:', re.search(r'\bversionName\s*=\s*"([^"]+)"', s).group(1))
          PY

      - name: Compilar APK com a chave permanente
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Conferir assinatura do APK gerado
        shell: bash
        env:
          REEL_SIGNING_SHA256: ${{ secrets.REEL_SIGNING_SHA256 }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$REEL_SIGNING_SHA256" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERRO: APK foi assinado com outra chave. SHA-256: $ACTUAL" >&2
            exit 1
          fi
          echo "Assinatura do APK confirmada: $ACTUAL"

      - name: Disponibilizar APK verificado
        uses: actions/upload-artifact@v4
        with:
          name: ReelSeries-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
